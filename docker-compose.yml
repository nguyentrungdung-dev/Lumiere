services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: lumiere-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-lumiere}
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-lumiere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumiere-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumiere-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@database:5432/${DB_NAME:-lumiere}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-lumiere}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_NAME=${APP_NAME:-Lumiere}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - UPLOAD_DIR=/app/uploads
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/alembic:/app/alembic
    depends_on:
      database:
        condition: service_healthy
    networks:
      - lumiere-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_API_BASE_PATH=/api/v1
    container_name: lumiere-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - lumiere-network

networks:
  lumiere-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

